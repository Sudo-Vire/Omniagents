name: Verify pinned sources

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - skill/dependencies/utils/sources.json

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that every pinned upstream archive still exists
        run: python skill/scripts/fetch_utils.py --verify
